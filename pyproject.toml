[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laservesselheatlab"
version = "0.1.0"
description = "LaserVesselHeatLab: axisymmetric bioheat simulation for pulsed lasers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LaserVesselHeatLab" }]
dependencies = [
  "streamlit>=1.36",
  "plotly>=5.20",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
packages = ["core", "app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["D203", "D212"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/LaserVesselHeatLab_единый_файл.py" = ["N999"]
